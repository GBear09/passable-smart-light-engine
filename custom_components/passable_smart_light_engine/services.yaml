reset_learning_data:
  name: Reset Learning Data
  description: Resets room lux yield curves, learned user sun preferences, media brightness levels, or late-night presets for a specific room or all rooms.
  fields:
    room_id:
      name: Room ID
      description: The room ID to reset (e.g. 'living_room'). If omitted, all rooms will be reset.
      example: "living_room"
      selector:
        text:
    reset_type:
      name: Reset Type
      description: The specific dataset category to clear.
      default: all
      required: false
      selector:
        select:
          options:
            - label: "All Datasets"
              value: "all"
            - label: "User Sun Preferences"
              value: "user_prefs"
            - label: "Room Lux Yield Curves"
              value: "room_curves"
            - label: "Media Player Presets"
              value: "media_prefs"
            - label: "Late Night Presets"
              value: "late_night_prefs"

calibrate_room_curve:
  name: Calibrate Room Curve
  description: Executes an automated yield calibration test across test brightness levels (25%, 50%, 75%, 100%) and records the room lux yield curve into storage. Calibration requires dark conditions (sun elevation < -4.0°) unless 'force' is enabled.
  fields:
    room_id:
      name: Room ID
      description: The room ID to calibrate (e.g. 'kitchen').
      example: "kitchen"
      required: true
      selector:
        text:
    force:
      name: Force Execution in Daylight
      description: Bypass daylight check if blackout shades are closed or the room has no windows.
      default: false
      required: false
      selector:
        boolean:

blueprint:
  name: "🧠 Passable AI Smart Lighting Controller"
  description: |
    # 🧠 Passable AI Smart Lighting Controller

    This blueprint acts as the frontend configuration for the `pyscript.passable_smart_light_engine` backend algorithm. 

    ### ⚙️ How the Algorithm Works:
    1. **Presence & Timeout:** Automatically turns lights on to the ideal level when the room is occupied, and turns them off after the specified vacancy timeout.
    2. **Dual-Track Learning (The AI):** * **User Preference:** If you manually adjust the dimmer, it logs the resulting room Lux and current sun position. Over time, it mathematically blends your `Target Ambient Lux (Seed)` with your historical preferences.
       * **Room Yield:** It calculates exactly how much Lux each 1% of brightness produces in *this specific room*, mapping a hardware capability curve to hit your target accurately.
    3. **Sensor Lag Compensation:** When learning from manual overrides, it uses asynchronous monitoring to wait for slow sensors (like Philips Hue) to report their final Lux values before saving data.
    4. **Contextual Bypasses:** Pause automations entirely or trigger specific learned brightness states when watching TV, sleeping, or away.

  domain: automation
  
  input:
    # ==========================================
    # CORE REQUIREMENTS (Always Visible)
    # ==========================================
    room_id:
      name: Room ID (Required)
      description: "A unique internal name with no spaces (e.g., 'living_room'). This is used as the key in the learning data to keep this room separate from others."
      default: "living_room"
      
    presence_entity:
      name: Presence Sensor (Required)
      description: "The binary sensor (PIR, mmWave, or Bayesian) that dictates if the room is occupied or vacant."
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    light_entity:
      name: Light Entity (Required)
      description: "The main dimmable light or light group to control. The script monitors this entity to detect manual physical switch overrides."
      selector:
        entity:
          domain: light

    lux_sensor:
      name: Illuminance Sensor (Required)
      description: "The sensor measuring ambient light (Lux). Used to calculate how much brightness to add, and to learn the room's light yield curve."
      selector:
        entity:
          domain: sensor
          device_class: illuminance

    target_lux:
      name: Target Ambient Lux (Seed)
      description: "The baseline brightness you want to maintain. The algorithm uses this as a starting point, but shifts towards your actual preferences as you manually override the lights."
      default: 40
      selector:
        number:
          min: 0
          max: 1000
          step: 5

    default_lux_ratio:
      name: Default Lux Ratio (Seed)
      description: "How many Lux does 1% of brightness produce? Used before the AI learns your room's actual light yield curve. If you find a room's lights are too dim when they initially turn on, this value should be set to something below 1."
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 20.0
          step: 0.1

    presence_timeout_min:
      name: Presence Timeout (Minutes)
      description: "How many minutes of vacancy to wait before automatically turning the lights off."
      default: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1

    # ==========================================
    # LATE NIGHT SETTINGS (Collapsible Section)
    # ==========================================
    late_night_settings:
      name: 🌙 Late Night Mode
      description: "Overrides normal sun-based lux targeting during designated hours. If you manually adjust the lights during this window, the AI will build a dedicated late-night learning profile."
      collapsed: true
      input:
        late_night_enabled:
          name: Enable Late Night Mode
          description: "Toggle to enable or disable the late night settings for this room."
          default: false
          selector:
            boolean:

        late_night_pct:
          name: Late Night Brightness % (Seed)
          description: "Target brightness during late night. Set to 0 to completely disable Late Night Mode."
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1

        late_night_condition_type:
          name: Late Night Trigger Method
          description: >
            Choose how Late Night mode is activated. This determines which of the settings below are used.
            
            **Time Schedule Priority:**

            🥇 **Time Helper:** Used if provided and valid.
            
            🥈 **Default Time:** Used as a fallback if the helper is missing or invalid.
          default: "time"
          selector:
            select:
              options:
                - label: "Time Schedule / Time Helpers"
                  value: "time"
                - label: "Entity State (e.g., Sleep Mode Boolean is ON)"
                  value: "entity_state"

        late_night_entity:
          name: Late Night State Entity (For 'Entity State' Method)
          description: "Select a binary sensor or input_boolean. When this is ON, Late Night mode is active."
          default: ""
          selector:
            entity: 
              domain: 
                - group
                - input_boolean

        late_night_start_time:
          name: Default Start Time (For 'Time' Method)
          description: "The standard time Late Night Mode begins."
          default: "22:00:00"
          selector:
            time:
            
        late_night_start_entity:
          name: Start Time Override Entity (Optional)
          description: "Select an input_datetime helper to dynamically override the fixed Start Time above based on other dashboard settings."
          default: ""
          selector:
            entity:
              domain: input_datetime
              
        late_night_stop_time:
          name: Default Stop Time (For 'Time' Method)
          description: "The standard time Late Night Mode ends and reverts to daytime algorithms."
          default: "06:00:00"
          selector:
            time:
            
        late_night_stop_entity:
          name: Stop Time Override Entity (Optional)
          description: "Select an input_datetime helper to dynamically override the fixed Stop Time above."
          default: ""
          selector:
            entity:
              domain: input_datetime

    # ==========================================
    # MEDIA SETTINGS (Collapsible Section)
    # ==========================================
    media_settings:
      name: 📺 Media Control
      description: "Settings for when a TV or media player is active in the room."
      collapsed: true
      input:
        media_entities:
          name: Media Players
          description: "Select one or more media players. If ANY are 'playing', standard lux adjustments pause and the Media Brightness is applied."
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true

        media_seed_pct:
          name: TV Brightness % (Seed)
          description: "The starting percentage for the lights when media is playing. If you manually adjust the lights while watching TV, the algorithm learns and updates this over time."
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 5

    # ==========================================
    # CIRCADIAN SETTINGS (Collapsible Section)
    # ==========================================
    circadian_settings:
      name: ☀️ Circadian Rhythm
      description: "Set the warmest and coolest color temperatures for the day."
      collapsed: true
      input:
        circadian_enabled:
          name: Enable Circadian Rhythm
          description: "Adjust color temperature based on sun position. Safely ignored if lights don't support color temp."
          default: false
          selector:
            boolean:
            
        min_color_temp:
          name: Warmest Temp (K)
          description: "Used at night and during sunrise/sunset."
          default: 2700
          selector:
            number:
              min: 2000
              max: 4000
              step: 100
              
        max_color_temp:
          name: Coolest Temp (K)
          description: "Used during peak daylight (solar noon)."
          default: 5500
          selector:
            number:
              min: 4000
              max: 6500
              step: 100

    # ==========================================
    # BYPASSES & EXCEPTIONS (Collapsible Section)
    # ==========================================
    bypasses:
      name: 🛑 Bypasses & Overrides
      description: "Configure conditions that pause the automation."
      collapsed: true
      input:
        bypass_freeze_entities:
          name: Freeze Bypasses (Stay As-Is)
          description: "Select booleans or sensors (e.g., 'Sleep Mode'). If active, automations pause and lights REMAIN at their current state."
          default: []
          selector:
            entity:
              multiple: true

        bypass_off_entities:
          name: Force-Off Bypasses
          description: "Select booleans or sensors (e.g., 'Away Mode'). If active, automations pause and lights force themselves OFF immediately."
          default: []
          selector:
            entity:
              multiple: true

        override_timeout_min:
          name: Manual Override Timeout (Minutes)
          description: "When someone physically touches the light switch or uses the HA dashboard, automations pause for this many minutes to prevent fighting the user."
          default: 60
          selector:
            number:
              min: 10
              max: 240
              step: 10

        manual_override_entity:
          name: Manual Override Indicator (Optional)
          description: "An input_boolean to automatically turn ON during a manual override and OFF when it expires. Tip: Add this same entity to your Freeze Bypasses above to let it double as a manual freeze switch!"
          default: ""
          selector:
            entity:
              domain: input_boolean
        ignore_max_brightness_override:
          name: Ignore Max Brightness Override
          description: "If enabled, manually turning the light ON to 100% (>= 95%) from an off state will NOT trigger the manual override timer (useful for disabling bedtime routines). The AI will still learn from it."
          default: true
          selector:
            boolean:

# ==========================================
# EXECUTION & TRIGGER ROUTING
# ==========================================
mode: queued

# Pass !input lists safely to the trigger templates
trigger_variables:
  presence_entities: !input presence_entity
  override_entity: !input manual_override_entity

trigger:
  # Trigger 1: Room occupied
  - platform: state
    entity_id: !input presence_entity
    to: "on"
    id: "presence_on"
    
  # Trigger 2: Room vacant for the configured timeout
  - platform: template
    value_template: >
      {{ expand(presence_entities) | selectattr('state', 'eq', 'on') | list | length == 0 }}
    for:
      minutes: !input presence_timeout_min
    id: "presence_off_timeout"
    
  # Trigger 3: Light entity brightness changes or is toggled (For override monitoring/learning)
  - platform: state
    entity_id: !input light_entity
    id: "light_change"
    
  # Trigger 4: Environmental lux changes (Instant hybrid reaction without waiting for heartbeat)
  - platform: state
    entity_id: !input lux_sensor
    id: "lux_change"
    
  # Trigger 5: TV or Media changes state
  - platform: state
    entity_id: !input media_entities
    id: "media_change"
    
  # Trigger 6: Catch when the user manually forces the override input_boolean ON
  - platform: template
    value_template: >
      {{ override_entity != '' and is_state(override_entity, 'on') }}
    id: "override_change"
    
  # Trigger 7: Catch when the override input_boolean expires or is toggled OFF
  - platform: template
    value_template: >
      {{ override_entity != '' and is_state(override_entity, 'off') }}
    id: "override_change"
    
  # Trigger 8: Periodic evaluation to slowly fade lights up/down if environmental lux shifts slightly
  - platform: time_pattern
    minutes: "/5"
    id: "heartbeat"

  # Trigger 9: Bypass freeze entities change state (Instant evaluation when bypass state toggles)
  - platform: state
    entity_id: !input bypass_freeze_entities
    id: "bypass_change"

  # Trigger 10: Bypass off entities change state (Instant evaluation when bypass state toggles)
  - platform: state
    entity_id: !input bypass_off_entities
    id: "bypass_change"

variables:
  presence_var: !input presence_entity
  media_var: !input media_entities
  override_var: !input manual_override_entity
  light_var: !input light_entity

action:

  # ==========================================
  # CONDITION CHECK
  # Only let the 5-minute heartbeat pass through if the room is active in some way.
  # Prevents unnecessary pyscript service calls on empty rooms.
  # ==========================================
  - condition: template
    value_template: >
      {% if trigger is defined and trigger.id == 'heartbeat' %}
        {% set presence_on = expand(presence_var) | selectattr('state', 'eq', 'on') | list | length > 0 %}
        {% set media_on = expand(media_var) | selectattr('state', 'in', ['playing', 'on', 'true', 'home', 'paused', 'idle', 'standby', 'buffering']) | list | length > 0 %}
        {% set light_on = is_state(light_var, 'on') %}
        {{ presence_on or media_on or light_on }}
      {% else %}
        true
      {% endif %}
      
  # ==========================================
  # FIRE PYSCRIPT EVENT
  # Pass all context and configuration variables to the backend engine
  # ==========================================
  - event: "passable_smart_light_engine_event"
    event_data:
      trigger_id: >
        {% set tid = trigger.id if trigger is defined else none %}
        {{ tid if tid is not none else 'none' }}
      trigger_to_state: >
        {% set t_state = trigger.get('to_state') if trigger is defined else none %}
        {{ t_state.state if t_state is not none else 'none' }}
      trigger_from_state: >
        {% set f_state = trigger.get('from_state') if trigger is defined else none %}
        {{ f_state.state if f_state is not none else 'none' }}
      trigger_from_brightness: >
        {% set f_state = trigger.get('from_state') if trigger is defined else none %}
        {{ f_state.attributes.brightness | default('none', true) if f_state is not none and f_state.attributes is defined else 'none' }}
      trigger_context_id: >
        {% set ts = trigger.get('to_state') if trigger is defined else none %}
        {{ ts.context.parent_id | default('none', true) if ts is not none and ts.context is defined else 'none' }}
      trigger_user_id: >
        {% set ts = trigger.get('to_state') if trigger is defined else none %}
        {{ ts.context.user_id | default('none', true) if ts is not none and ts.context is defined else 'none' }}
      room_id: !input room_id
      presence_entity: !input presence_entity
      light_entity: !input light_entity
      lux_sensor: !input lux_sensor
      target_lux: !input target_lux
      default_lux_ratio: !input default_lux_ratio
      presence_timeout_min: !input presence_timeout_min
      circadian_enabled: !input circadian_enabled
      min_color_temp: !input min_color_temp
      max_color_temp: !input max_color_temp
      media_entities: !input media_entities
      media_seed_pct: !input media_seed_pct
      bypass_freeze_entities: !input bypass_freeze_entities
      bypass_off_entities: !input bypass_off_entities
      override_timeout_min: !input override_timeout_min
      manual_override_entity: !input manual_override_entity
      ignore_max_brightness_override: !input ignore_max_brightness_override
      late_night_enabled: !input late_night_enabled
      late_night_pct: !input late_night_pct
      late_night_condition_type: !input late_night_condition_type
      late_night_entity: !input late_night_entity
      late_night_start_time: !input late_night_start_time
      late_night_start_entity: !input late_night_start_entity
      late_night_stop_time: !input late_night_stop_time
      late_night_stop_entity: !input late_night_stop_entity
